<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CogAT Practice Test</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EFEA; --page:#FFFFFF; --ink:#1B2420; --muted:#56635B; --form:#2B6A4B; --form-ink:#FFFFFF;
  --tint:#D9E9DF; --line:#C3D3C8; --mark:#22302A; --mark-ink:#FFFFFF; --alert:#A23F29; --ok:#2B6A4B; --tile:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --page:#151D19; --ink:#E1E9E4; --muted:#9BA9A1; --form:#7CC39F; --form-ink:#0E1411;
    --tint:#1C2C23; --line:#2B3A32; --mark:#E1E9E4; --mark-ink:#0E1411; --alert:#F08C70; --ok:#7CC39F; --tile:#F5F5F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --page:#151D19; --ink:#E1E9E4; --muted:#9BA9A1; --form:#7CC39F; --form-ink:#0E1411;
  --tint:#1C2C23; --line:#2B3A32; --mark:#E1E9E4; --mark-ink:#0E1411; --alert:#F08C70; --ok:#7CC39F; --tile:#F5F5F0;
  color-scheme: dark;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size:17px; line-height:1.5;
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--form); outline-offset:2px; }
main{ max-width:680px; margin:0 auto; padding:16px 16px 40px; }
h1{ font-size:2.1rem; line-height:1.1; margin:.4em 0 .25em; letter-spacing:-.01em; }
h2{ font-size:1.35rem; line-height:1.2; margin:1.4em 0 .5em; }
h3{ font-size:1.05rem; margin:0; }
p{ margin:.5em 0; max-width:62ch; }
.muted{ color:var(--muted); }
.small{ font-size:.88rem; }

/* top bar */
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:2px solid var(--form); }
.bar-in{ max-width:680px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; }
.bar-title{ flex:1; min-width:0; }
.bar-title b{ display:block; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-title span{ font-size:.85rem; color:var(--muted); }
.timer{ font-variant-numeric:tabular-nums; font-weight:700; font-size:1.25rem; padding:2px 10px; border-radius:6px; border:2px solid var(--form); color:var(--form); min-width:4.4ch; text-align:center; }
.timer.low{ color:var(--alert); border-color:var(--alert); }
.timer.off{ font-size:.85rem; font-weight:400; }
.iconbtn{ border:0; background:none; padding:6px 8px; border-radius:6px; cursor:pointer; color:var(--muted); font-size:.9rem; }
.iconbtn[aria-pressed="true"]{ color:var(--alert); }

/* home */
.hero{ padding:8px 0 4px; }
.hero h1{ font-size:2.5rem; }
.sheet{ background:var(--page); border:2px solid var(--form); border-radius:10px; overflow:hidden; margin:18px 0; }
.sheet-head{ background:var(--form); color:var(--form-ink); padding:8px 14px; display:flex; justify-content:space-between; font-weight:700; }
.sheet-head span{ font-weight:400; }
.row{ display:grid; grid-template-columns:2.2em 1fr auto; gap:10px; align-items:center; padding:10px 14px; border-top:1px solid var(--line); }
.row:first-of-type{ border-top:0; }
.num{ width:2em; height:2em; border-radius:50%; border:2px solid var(--form); display:grid; place-items:center; font-weight:700; font-size:.85rem; color:var(--form); }
.num.done{ background:var(--form); color:var(--form-ink); }
.row .meta{ font-size:.85rem; color:var(--muted); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:8px; padding:12px 18px; border:2px solid var(--form); background:var(--form); color:var(--form-ink); font-weight:700; cursor:pointer; text-decoration:none; }
.btn.ghost{ background:transparent; color:var(--form); }
.btn.slim{ padding:6px 12px; font-size:.9rem; }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:default; }
.seg{ display:inline-flex; border:2px solid var(--form); border-radius:8px; overflow:hidden; }
.seg button{ border:0; background:transparent; padding:8px 14px; cursor:pointer; color:var(--form); font-weight:700; }
.seg button[aria-pressed="true"]{ background:var(--form); color:var(--form-ink); }
.notes{ border-left:4px solid var(--line); padding:2px 0 2px 14px; margin:18px 0; }
.stack{ display:flex; flex-direction:column; gap:10px; }
.callout{ background:var(--tint); border-radius:10px; padding:12px 14px; margin:14px 0; }

/* question */
.card{ background:var(--page); border:1px solid var(--line); border-radius:10px; padding:18px 16px; margin:14px 0; }
.prompt{ font-size:.92rem; color:var(--muted); margin:0 0 10px; }
.analogy{ display:flex; flex-wrap:wrap; gap:6px 18px; font-size:1.3rem; font-weight:700; justify-content:center; }
.pair{ display:inline-flex; gap:10px; align-items:center; white-space:nowrap; }
.arr{ color:var(--form); font-weight:400; }
.colon{ color:var(--muted); font-weight:400; }
.qbox{ display:inline-grid; place-items:center; min-width:1.8em; height:1.6em; border:2px solid var(--ink); border-radius:4px; font-weight:700; padding:0 .2em; }
.sentence{ font-size:1.15rem; line-height:1.6; }
.gap{ display:inline-block; width:4.5em; border-bottom:2px solid var(--ink); transform:translateY(-.2em); }
.words{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.chip{ padding:6px 14px; border:2px solid var(--line); border-radius:999px; font-weight:700; font-size:1.15rem; background:var(--bg); }
.na{ display:flex; flex-wrap:wrap; gap:10px 14px; justify-content:center; font-size:1.25rem; font-weight:700; font-variant-numeric:tabular-nums; }
.na .grp{ white-space:nowrap; }
.eqs{ display:flex; flex-direction:column; align-items:center; gap:8px; font-size:1.3rem; font-weight:700; font-variant-numeric:tabular-nums; }
.series{ display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; font-size:1.3rem; font-weight:700; font-variant-numeric:tabular-nums; }
.tile{ background:var(--tile); border:1.5px solid #9AA59E; border-radius:6px; aspect-ratio:1; display:block; }
.tile svg{ display:block; width:100%; height:100%; }
.matrix{ display:grid; grid-template-columns:1fr auto 1fr; gap:8px 10px; align-items:center; max-width:300px; margin:0 auto; }
.matrix .arr{ font-size:1.4rem; }
.matrix .qtile{ background:var(--tile); border:2px dashed #7d8a82; border-radius:6px; aspect-ratio:1; display:grid; place-items:center; font-size:1.6rem; font-weight:700; color:#55605a; }
.folds{ display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); gap:8px; max-width:440px; margin:0 auto; }
.folds .last{ border-color:var(--form); border-width:2px; }
.cls{ display:flex; align-items:center; gap:8px; max-width:380px; margin:0 auto; }
.cls .tile{ flex:1; }
.cls .div{ width:2px; align-self:stretch; background:var(--ink); margin:0 4px; opacity:.6; }

/* options */
.opts{ list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
.opt{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--page); border:1.5px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer; font-size:1.1rem; min-height:52px; }
.opt:hover{ border-color:var(--form); }
.bub{ flex:none; width:32px; height:32px; border-radius:50%; border:2px solid var(--mark); display:grid; place-items:center; font-weight:700; font-size:.9rem; position:relative; overflow:hidden; }
.bub::before{ content:""; position:absolute; inset:0; border-radius:50%; background:var(--mark); transform:scale(0); transition:transform .14s ease-out; }
.bub i{ position:relative; font-style:normal; }
.opt.sel{ border-color:var(--mark); }
.opt.sel .bub::before{ transform:scale(1); }
.opt.sel .bub i{ color:var(--mark-ink); }
.figopts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
@media (min-width:560px){ .figopts{ grid-template-columns:repeat(5,minmax(0,1fr)); } }
.figopt{ flex-direction:column; padding:8px; gap:8px; min-height:0; }
.figopt .tile{ width:100%; }
.opt.right{ border-color:var(--ok); box-shadow:0 0 0 2px var(--ok) inset; }
.opt.wrong{ border-color:var(--alert); box-shadow:0 0 0 2px var(--alert) inset; }

.nav{ position:sticky; bottom:0; background:var(--bg); padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; align-items:center; border-top:1px solid var(--line); margin-top:18px; }
.nav .grow{ flex:1; }

/* map overlay */
.overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
.panel{ background:var(--page); width:100%; max-width:680px; border-radius:14px 14px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:80vh; overflow:auto; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:8px; margin:12px 0; }
.cell{ height:44px; border-radius:50%; border:2px solid var(--mark); background:transparent; font-weight:700; cursor:pointer; position:relative; }
.cell.ans{ background:var(--mark); color:var(--mark-ink); }
.cell.cur{ outline:3px solid var(--form); outline-offset:2px; }
.cell.flag::after{ content:""; position:absolute; top:-3px; right:-3px; width:12px; height:12px; border-radius:50%; background:var(--alert); border:2px solid var(--page); }

/* results */
.score{ font-size:4rem; font-weight:700; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.score small{ font-size:1.4rem; color:var(--muted); font-weight:400; }
table{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th,td{ text-align:left; padding:9px 6px; border-top:1px solid var(--line); }
td.r,th.r{ text-align:right; }
tr.bat td{ font-weight:700; background:var(--tint); }
.bar-meter{ height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
.bar-meter i{ display:block; height:100%; background:var(--form); }
.rv{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:none; padding:10px 4px; cursor:pointer; }
.mk{ width:1.6em; text-align:center; font-weight:700; }
.mk.y{ color:var(--ok); } .mk.n{ color:var(--alert); }
.exp{ background:var(--tint); border-radius:8px; padding:10px 12px; margin-top:10px; }
.links li{ margin:.4em 0; }
a{ color:var(--form); }
@media (prefers-reduced-motion: reduce){ .bub::before{ transition:none; } }
.gate{ display:flex; flex-direction:column; gap:10px; max-width:320px; margin-top:18px; }
.gate input{ font:inherit; font-size:1.5rem; letter-spacing:.35em; padding:10px 14px; border:2px solid var(--form); border-radius:8px; background:var(--page); color:var(--ink); }
.err{ color:var(--alert); min-height:1.4em; margin:0; }
.att{ display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:12px 14px; border-top:1px solid var(--line); }
.att:first-of-type{ border-top:0; }
.att .meta{ font-size:.85rem; color:var(--muted); }
.ok-note{ color:var(--ok); font-weight:700; }
textarea.dump{ width:100%; height:45vh; font:13px/1.4 ui-monospace, Menlo, Consolas, monospace; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--page); color:var(--ink); }
</style>
</head>
<body>
<div id="bar"></div>
<main id="app"></main>
<div id="layer"></div>
<script>
const DATA = {"sections":[{"id":"va","battery":"Verbal","name":"Verbal Analogies","prompt":"Which word goes with the third word in the same way the second word goes with the first?","directions":"The first two words go together in a certain way. Choose the answer that goes with the third word in the same way.","tip":"Put the first pair into a sentence, such as “An author creates a novel.” Then try the same sentence with each answer.","items":[{"t":"va","a":"author","b":"novel","c":"composer","opts":["orchestra","symphony","conductor","audience","piano"],"ans":1,"exp":"An author creates a novel; a composer creates a symphony."},{"t":"va","a":"glove","b":"hand","c":"thimble","opts":["finger","thread","sewing","cloth","needle"],"ans":0,"exp":"A glove protects a hand; a thimble protects a finger."},{"t":"va","a":"tadpole","b":"frog","c":"caterpillar","opts":["insect","leaf","cocoon","larva","butterfly"],"ans":4,"exp":"A tadpole grows into a frog; a caterpillar grows into a butterfly."},{"t":"va","a":"flock","b":"sheep","c":"swarm","opts":["queen","bees","sting","hive","honey"],"ans":1,"exp":"A flock is a group of sheep; a swarm is a group of bees."},{"t":"va","a":"drought","b":"water","c":"famine","opts":["hunger","food","poverty","crop","rain"],"ans":1,"exp":"A drought is a severe shortage of water; a famine is a severe shortage of food."},{"t":"va","a":"carpenter","b":"saw","c":"surgeon","opts":["patient","nurse","surgery","scalpel","hospital"],"ans":3,"exp":"A saw is a cutting tool a carpenter uses; a scalpel is a cutting tool a surgeon uses."},{"t":"va","a":"thermometer","b":"temperature","c":"odometer","opts":["fuel","engine","speed","time","distance"],"ans":4,"exp":"A thermometer measures temperature; an odometer measures distance traveled. (A speedometer measures speed.)"},{"t":"va","a":"sculptor","b":"marble","c":"potter","opts":["kiln","wheel","clay","vase","glaze"],"ans":2,"exp":"Marble is the material a sculptor shapes; clay is the material a potter shapes."},{"t":"va","a":"evaporate","b":"vapor","c":"freeze","opts":["liquid","cold","winter","melt","ice"],"ans":4,"exp":"When water evaporates it becomes vapor; when it freezes it becomes ice."},{"t":"va","a":"hilarious","b":"funny","c":"enormous","opts":["big","huge","tiny","weight","giant"],"ans":0,"exp":"Hilarious means extremely funny; enormous means extremely big. Huge and giant are near-synonyms of enormous, not the milder word."},{"t":"va","a":"atlas","b":"maps","c":"dictionary","opts":["library","books","alphabet","definitions","spelling"],"ans":3,"exp":"An atlas is a collection of maps; a dictionary is a collection of definitions."},{"t":"va","a":"frugal","b":"wasteful","c":"timid","opts":["shy","fearful","bold","nervous","quiet"],"ans":2,"exp":"Frugal is the opposite of wasteful; timid is the opposite of bold."},{"t":"va","a":"scene","b":"play","c":"stanza","opts":["verse","rhyme","poem","poet","line"],"ans":2,"exp":"A scene is a section of a play; a stanza is a section of a poem."},{"t":"va","a":"pebble","b":"boulder","c":"pond","opts":["puddle","stream","river","lake","water"],"ans":3,"exp":"A boulder is a much larger pebble; a lake is a much larger pond."},{"t":"va","a":"mumble","b":"speak","c":"scribble","opts":["paper","read","write","draw","pencil"],"ans":2,"exp":"To mumble is to speak carelessly and unclearly; to scribble is to write carelessly and unclearly."},{"t":"va","a":"benevolent","b":"kindness","c":"arrogant","opts":["pride","power","humility","anger","wealth"],"ans":0,"exp":"A benevolent person shows kindness; an arrogant person shows pride."},{"t":"va","a":"scarce","b":"abundant","c":"ancient","opts":["modern","old","historic","aged","ruins"],"ans":0,"exp":"Scarce is the opposite of abundant; ancient is the opposite of modern."},{"t":"va","a":"vaccine","b":"disease","c":"sunscreen","opts":["skin","lotion","summer","beach","sunburn"],"ans":4,"exp":"A vaccine prevents disease; sunscreen prevents sunburn."},{"t":"va","a":"archive","b":"documents","c":"arsenal","opts":["fortress","war","army","weapons","soldiers"],"ans":3,"exp":"An archive is a place where documents are stored; an arsenal is a place where weapons are stored."},{"t":"va","a":"exhausted","b":"tired","c":"furious","opts":["rage","angry","loud","upset","calm"],"ans":1,"exp":"Exhausted means extremely tired; furious means extremely angry."},{"t":"va","a":"sonnet","b":"poem","c":"waltz","opts":["rhythm","music","dance","ballroom","partner"],"ans":2,"exp":"A sonnet is one kind of poem; a waltz is one kind of dance."},{"t":"va","a":"candid","b":"honesty","c":"meticulous","opts":["intelligence","care","anxiety","speed","carelessness"],"ans":1,"exp":"Candid describes someone who shows honesty; meticulous describes someone who shows great care."},{"t":"va","a":"ambiguous","b":"clear","c":"verbose","opts":["concise","loud","rude","clear","wordy"],"ans":0,"exp":"Ambiguous is the opposite of clear; verbose (using too many words) is the opposite of concise."},{"t":"va","a":"novice","b":"expert","c":"apprentice","opts":["trainee","teacher","student","master","worker"],"ans":3,"exp":"A novice who gains skill becomes an expert; an apprentice who completes training becomes a master."}]},{"id":"sc","battery":"Verbal","name":"Sentence Completion","prompt":"Which word best completes the sentence?","directions":"Choose the word that makes the best sense in the sentence.","tip":"Look for signal words like “although,” “because,” “unlike” and “despite.” They tell you whether the missing word agrees with or contrasts with the rest of the sentence.","items":[{"t":"sc","s":"Because the bridge was closed for repairs, drivers had to take a longer _____ across the river.","opts":["bridge","route","ticket","vehicle","distance"],"ans":1,"exp":"Drivers take a route. The other words don’t describe the way they traveled."},{"t":"sc","s":"The museum guide asked visitors not to touch the paintings, since even clean hands can _____ the delicate surfaces.","opts":["damage","clean","display","frame","improve"],"ans":0,"exp":"The warning makes sense only if touching could damage the paintings."},{"t":"sc","s":"Maya was so _____ about the trip that she packed her suitcase a full week early.","opts":["reluctant","bored","confused","eager","tired"],"ans":3,"exp":"Packing a week early shows she was eager. Reluctant or bored would mean the opposite."},{"t":"sc","s":"The scientist would not announce her conclusion until further experiments could _____ her results.","opts":["question","ignore","delay","confirm","publish"],"ans":3,"exp":"She waited for more experiments to confirm (prove) her results before announcing them."},{"t":"sc","s":"Unlike his _____ older brother, who rarely spoke at parties, Leo enjoyed chatting with everyone.","opts":["popular","generous","athletic","reserved","talkative"],"ans":3,"exp":"“Rarely spoke” describes someone reserved, and “unlike” sets him in contrast with Leo."},{"t":"sc","s":"The ancient coins were so _____ that only a few dozen are known to exist today.","opts":["shiny","rare","heavy","old","valuable"],"ans":1,"exp":"“Only a few dozen exist” is what rare means. Valuable doesn’t explain how few there are."},{"t":"sc","s":"The coach’s _____ instructions confused the team, because each player understood them differently.","opts":["helpful","loud","ambiguous","brief","strict"],"ans":2,"exp":"Instructions that can be understood in different ways are ambiguous."},{"t":"sc","s":"After weeks without rain, the once-green lawn had become _____ and brown.","opts":["parched","flooded","frozen","muddy","lush"],"ans":0,"exp":"No rain for weeks leaves grass parched (dried out)."},{"t":"sc","s":"Although the hike was _____, the view from the summit made every difficult step worth it.","opts":["popular","crowded","pleasant","short","grueling"],"ans":4,"exp":"“Although” and “every difficult step” point to a contrast: the hike was grueling (exhausting)."},{"t":"sc","s":"The new phone was _____ within a year, replaced by a model with twice the memory.","opts":["obsolete","durable","expensive","fragile","popular"],"ans":0,"exp":"Being replaced by a better model makes something obsolete (out of date)."},{"t":"sc","s":"Rather than _____ the problem, the committee chose to discuss it openly at the meeting.","opts":["solve","mention","conceal","report","explain"],"ans":2,"exp":"“Rather than” signals the opposite of discussing openly: concealing (hiding) it."},{"t":"sc","s":"The detective noticed a small _____ in the suspect’s story: he said it was raining, but the streets were dry.","opts":["reason","inconsistency","clue","detail","witness"],"ans":1,"exp":"Rain but dry streets is a contradiction, an inconsistency in the story."},{"t":"sc","s":"Jamal is so _____ with his money that he saved nearly all of his summer earnings.","opts":["lucky","careless","generous","wealthy","frugal"],"ans":4,"exp":"Saving almost everything shows he is frugal (careful not to waste money)."},{"t":"sc","s":"The mayor’s speech was meant to _____ the anxious crowd, but her nervous tone only made people more worried.","opts":["gather","alarm","reassure","entertain","dismiss"],"ans":2,"exp":"“But … more worried” means the goal was the opposite: to reassure (calm) them."},{"t":"sc","s":"The once-thriving town became nearly _____ after the factory closed and families moved away.","opts":["crowded","deserted","noisy","wealthy","modern"],"ans":1,"exp":"When families move away, a town becomes deserted (empty)."},{"t":"sc","s":"Her _____ apology, delivered with a smirk, convinced no one that she was actually sorry.","opts":["heartfelt","lengthy","public","sudden","insincere"],"ans":4,"exp":"A smirk and convincing no one show the apology was insincere (not genuine)."},{"t":"sc","s":"Because the evidence was only _____, the jury could not be certain the defendant was guilty.","opts":["convincing","recent","false","written","circumstantial"],"ans":4,"exp":"Circumstantial evidence suggests something indirectly without proving it, which explains the jury’s doubt."},{"t":"sc","s":"The author’s style is remarkably _____: she can describe a whole scene in a single, precise sentence.","opts":["concise","old-fashioned","humorous","confusing","verbose"],"ans":0,"exp":"Saying a lot in one precise sentence is what concise means. Verbose is the opposite."},{"t":"sc","s":"Scientists consider the idea _____ because no experiment could ever show it to be false.","opts":["ancient","correct","untestable","proven","popular"],"ans":2,"exp":"If no experiment could ever check it, the idea is untestable."},{"t":"sc","s":"Despite the critics’ _____ reviews, the film became a hit as audiences ignored the negative press.","opts":["brief","mixed","early","scathing","glowing"],"ans":3,"exp":"“Negative press” means the reviews were scathing (harshly critical). Mixed reviews aren’t fully negative."}]},{"id":"vc","battery":"Verbal","name":"Verbal Classification","prompt":"Which word belongs with these three words?","directions":"The three words in the top row are alike in some way. Choose the answer that belongs in the same group.","tip":"If more than one answer fits your first idea, look for a narrower group. “Brass instruments” is more precise than “instruments.”","items":[{"t":"vc","w":["trumpet","trombone","tuba"],"opts":["flute","piano","French horn","drum","violin"],"ans":2,"exp":"Trumpet, trombone and tuba are brass instruments. So is the French horn. A flute is a woodwind."},{"t":"vc","w":["Nile","Amazon","Mississippi"],"opts":["Everest","Sahara","Pacific","Superior","Danube"],"ans":4,"exp":"All are rivers. The Danube is a river; Superior is a lake."},{"t":"vc","w":["Mercury","Venus","Mars"],"opts":["Sun","Comet","Earth","Moon","Galaxy"],"ans":2,"exp":"All are planets. Earth is the only planet among the choices."},{"t":"vc","w":["thermometer","barometer","ruler"],"opts":["number","science","weather","laboratory","scale"],"ans":4,"exp":"All are measuring instruments. A scale measures weight."},{"t":"vc","w":["bake","roast","broil"],"opts":["serve","chop","stir","freeze","grill"],"ans":4,"exp":"All are ways of cooking with heat. Grill is the only other way of cooking with heat."},{"t":"vc","w":["carpenter","plumber","electrician"],"opts":["lawyer","doctor","banker","mason","teacher"],"ans":3,"exp":"All are skilled building trades. A mason builds with stone or brick."},{"t":"vc","w":["square","rhombus","trapezoid"],"opts":["circle","parallelogram","cube","pentagon","triangle"],"ans":1,"exp":"All are four-sided shapes (quadrilaterals). So is a parallelogram."},{"t":"vc","w":["democracy","monarchy","dictatorship"],"opts":["president","republic","election","country","law"],"ans":1,"exp":"All are forms of government. A republic is too."},{"t":"vc","w":["copper","iron","aluminum"],"opts":["plastic","nickel","stone","wood","glass"],"ans":1,"exp":"All are metals. Nickel is a metal."},{"t":"vc","w":["whisper","murmur","mutter"],"opts":["mumble","shout","talk","yell","sing"],"ans":0,"exp":"All mean speaking quietly or unclearly. Mumble fits; talk is too general."},{"t":"vc","w":["hurricane","tornado","blizzard"],"opts":["season","rain","cloud","typhoon","wind"],"ans":3,"exp":"All are severe storms. A typhoon is a severe storm."},{"t":"vc","w":["inch","foot","yard"],"opts":["mile","ounce","liter","acre","pound"],"ans":0,"exp":"All are units of length. Mile is the only unit of length among the choices."},{"t":"vc","w":["ecstatic","elated","overjoyed"],"opts":["thrilled","calm","content","satisfied","cheerful"],"ans":0,"exp":"All mean extremely happy. Thrilled matches that strength; content and cheerful are milder."},{"t":"vc","w":["famine","drought","flood"],"opts":["harvest","disaster","earthquake","weather","rescue"],"ans":2,"exp":"All are natural disasters. Earthquake is one. “Disaster” names the group instead of being a member of it."},{"t":"vc","w":["Shakespeare","Dickens","Austen"],"opts":["Mozart","Lincoln","Twain","Einstein","Picasso"],"ans":2,"exp":"All are famous writers. Mark Twain is a writer."},{"t":"vc","w":["vertebra","femur","rib"],"opts":["muscle","tendon","heart","skull","skeleton"],"ans":3,"exp":"All are bones. The skull is a bone; skeleton names the whole group."},{"t":"vc","w":["ignite","kindle","spark"],"opts":["extinguish","ash","heat","smoke","light"],"ans":4,"exp":"All mean to start a fire. To light a fire also means to start one."},{"t":"vc","w":["stingy","miserly","tight-fisted"],"opts":["generous","poor","greedy","cheap","wealthy"],"ans":3,"exp":"All describe someone unwilling to spend money. Cheap means the same; greedy means wanting more."},{"t":"vc","w":["sprint","dash","race"],"opts":["hurry","pause","march","stroll","wander"],"ans":0,"exp":"All mean moving very fast. Hurry fits; stroll, wander and march are slower."},{"t":"vc","w":["prologue","preface","introduction"],"opts":["epilogue","foreword","index","glossary","chapter"],"ans":1,"exp":"All come at the beginning of a book. A foreword also does; an epilogue comes at the end."}]},{"id":"na","battery":"Quantitative","name":"Number Analogies","prompt":"The same rule changes the first number into the second in each pair. What is the missing number?","directions":"Find a rule that works for both of the first two pairs. Use it on the third number.","tip":"Make sure your rule works for both pairs, not just the first one. Some rules have two steps, such as “double, then subtract 2.”","items":[{"t":"na","p":[["6","18"],["9","27"],["12","?"]],"opts":["36","39","30","24","48"],"ans":0,"exp":"Multiply by 3: 12 × 3 = 36."},{"t":"na","p":[["45","38"],["30","23"],["17","?"]],"opts":["7","24","11","10","14"],"ans":3,"exp":"Subtract 7: 17 − 7 = 10."},{"t":"na","p":[["64","8"],["24","3"],["56","?"]],"opts":["9","7","8","6","48"],"ans":1,"exp":"Divide by 8: 56 ÷ 8 = 7."},{"t":"na","p":[["12","3"],["20","5"],["36","?"]],"opts":["6","12","18","32","9"],"ans":4,"exp":"Divide by 4: 36 ÷ 4 = 9."},{"t":"na","p":[["5","26"],["3","16"],["8","?"]],"opts":["48","39","41","40","43"],"ans":2,"exp":"Multiply by 5, then add 1: 8 × 5 + 1 = 41."},{"t":"na","p":[["2","4"],["5","25"],["9","?"]],"opts":["81","18","90","36","72"],"ans":0,"exp":"Square the number: 9 × 9 = 81. (Doubling works for 2 → 4 but not 5 → 25.)"},{"t":"na","p":[["7","12"],["15","28"],["11","?"]],"opts":["20","22","16","24","18"],"ans":0,"exp":"Double, then subtract 2: 11 × 2 − 2 = 20."},{"t":"na","p":[["1/2","1"],["3/4","3/2"],["5/8","?"]],"opts":["5/16","13/8","5/2","5/4","3/4"],"ans":3,"exp":"Multiply by 2: 5/8 × 2 = 10/8 = 5/4."},{"t":"na","p":[["0.4","4"],["1.5","15"],["0.08","?"]],"opts":["8","0.008","0.18","80","0.8"],"ans":4,"exp":"Multiply by 10: 0.08 × 10 = 0.8."},{"t":"na","p":[["36","6"],["81","9"],["144","?"]],"opts":["72","10","12","14","16"],"ans":2,"exp":"Take the square root: √144 = 12."},{"t":"na","p":[["10","4"],["25","7"],["40","?"]],"opts":["12","10","13","9","8"],"ans":1,"exp":"Divide by 5, then add 2: 40 ÷ 5 + 2 = 10."},{"t":"na","p":[["−3","−9"],["4","12"],["−6","?"]],"opts":["−9","−3","−18","18","−2"],"ans":2,"exp":"Multiply by 3: −6 × 3 = −18."},{"t":"na","p":[["3","10"],["6","37"],["4","?"]],"opts":["15","17","9","16","13"],"ans":1,"exp":"Square, then add 1: 4 × 4 + 1 = 17."},{"t":"na","p":[["24","15"],["40","25"],["16","?"]],"opts":["11","10","8","12","7"],"ans":1,"exp":"Multiply by 5/8 (divide by 8, then multiply by 5): 16 ÷ 8 × 5 = 10."},{"t":"na","p":[["2","9"],["3","28"],["4","?"]],"opts":["17","81","63","65","64"],"ans":3,"exp":"Cube, then add 1: 4 × 4 × 4 + 1 = 65."},{"t":"na","p":[["3/5","5/3"],["2/7","7/2"],["1/4","?"]],"opts":["4","1/2","1/4","2","1/16"],"ans":0,"exp":"Flip the fraction (take the reciprocal): 1/4 becomes 4/1 = 4."},{"t":"na","p":[["9","4"],["17","8"],["33","?"]],"opts":["17","15","16","14","66"],"ans":2,"exp":"Subtract 1, then divide by 2: (33 − 1) ÷ 2 = 16."},{"t":"na","p":[["6","38"],["10","102"],["7","?"]],"opts":["49","53","47","44","51"],"ans":4,"exp":"Square, then add 2: 7 × 7 + 2 = 51."}]},{"id":"np","battery":"Quantitative","name":"Number Puzzles","prompt":"What number goes in the box with the question mark?","directions":"Both sides of each equal sign must be the same amount. Each shape stands for a number.","tip":"Start with the bottom line to find what each shape stands for, then work upward to the question mark.","items":[{"t":"np","lines":["? − 15 = 27"],"opts":["42","32","12","38","52"],"ans":0,"exp":"? = 27 + 15 = 42."},{"t":"np","lines":["? × 6 = 54"],"opts":["7","60","48","8","9"],"ans":4,"exp":"? = 54 ÷ 6 = 9."},{"t":"np","lines":["72 ÷ ? = 8"],"opts":["12","6","64","9","8"],"ans":3,"exp":"72 ÷ 9 = 8, so ? = 9."},{"t":"np","lines":["? + 18 = 7 × 5"],"opts":["53","23","15","17","19"],"ans":3,"exp":"7 × 5 = 35, and 35 − 18 = 17."},{"t":"np","lines":["? = ◆ + 9","◆ = 4 × 6"],"opts":["24","36","33","30","15"],"ans":2,"exp":"◆ = 24, so ? = 24 + 9 = 33."},{"t":"np","lines":["? − ◆ = 12","◆ = 45 ÷ 5"],"opts":["21","9","24","17","3"],"ans":0,"exp":"◆ = 9, so ? − 9 = 12 and ? = 21."},{"t":"np","lines":["? × 3 = ◆","◆ = 50 − 14"],"opts":["9","36","108","12","33"],"ans":3,"exp":"◆ = 36, so ? × 3 = 36 and ? = 12."},{"t":"np","lines":["48 ÷ ? = ◆ − 2","◆ = 10"],"opts":["8","6","5","4","12"],"ans":1,"exp":"◆ − 2 = 8, so 48 ÷ ? = 8 and ? = 6."},{"t":"np","lines":["? = 3 × ◆ − 5","◆ + 7 = 15"],"opts":["24","21","19","29","17"],"ans":2,"exp":"◆ = 8, so ? = 3 × 8 − 5 = 19."},{"t":"np","lines":["(? + 6) × 2 = 30"],"opts":["9","12","7","15","24"],"ans":0,"exp":"? + 6 = 15, so ? = 9."},{"t":"np","lines":["? + ◆ = 40","◆ = ● × 4","● = 7"],"opts":["28","12","13","11","10"],"ans":1,"exp":"● = 7, so ◆ = 28 and ? = 40 − 28 = 12."},{"t":"np","lines":["? × ◆ = 84","◆ = 19 − 12"],"opts":["13","14","7","11","12"],"ans":4,"exp":"◆ = 7, so ? = 84 ÷ 7 = 12."},{"t":"np","lines":["? ÷ 4 = ◆","◆ − ● = 5","● = 9"],"opts":["56","36","14","60","48"],"ans":0,"exp":"● = 9, so ◆ = 14 and ? = 14 × 4 = 56."},{"t":"np","lines":["? × ? = ◆ + 13","◆ = 36"],"opts":["6","9","7","8","49"],"ans":2,"exp":"◆ + 13 = 49, and 7 × 7 = 49, so ? = 7."},{"t":"np","lines":["? = ◆ ÷ ●","◆ = 9 × 8","● = 15 − 9"],"opts":["8","9","18","6","12"],"ans":4,"exp":"◆ = 72 and ● = 6, so ? = 72 ÷ 6 = 12."},{"t":"np","lines":["2 × ? − ◆ = 17","◆ = ● + 4","● = 3 × 3"],"opts":["30","15","17","13","14"],"ans":1,"exp":"● = 9, so ◆ = 13. Then 2 × ? = 30 and ? = 15."}]},{"id":"ns","battery":"Quantitative","name":"Number Series","prompt":"Which number comes next?","directions":"The numbers follow a pattern. Choose the number that comes next.","tip":"Write the change between each pair of numbers. If that doesn’t show a pattern, look at every other number.","items":[{"t":"ns","seq":["7","11","15","19","23"],"opts":["25","31","26","28","27"],"ans":4,"exp":"Add 4 each time: 23 + 4 = 27."},{"t":"ns","seq":["96","48","24","12"],"opts":["0","8","10","6","3"],"ans":3,"exp":"Divide by 2 each time: 12 ÷ 2 = 6."},{"t":"ns","seq":["3","4","6","9","13","18"],"opts":["24","23","25","22","26"],"ans":0,"exp":"Add 1, 2, 3, 4, 5, then 6: 18 + 6 = 24."},{"t":"ns","seq":["2","6","18","54"],"opts":["72","156","216","108","162"],"ans":4,"exp":"Multiply by 3 each time: 54 × 3 = 162."},{"t":"ns","seq":["40","37","39","36","38","35"],"opts":["36","33","37","32","34"],"ans":2,"exp":"Subtract 3, add 2, repeating: 35 + 2 = 37."},{"t":"ns","seq":["1","4","9","16","25"],"opts":["30","49","36","34","35"],"ans":2,"exp":"Square numbers: 1², 2², 3², 4², 5², so next is 6² = 36."},{"t":"ns","seq":["5","10","8","16","14","28"],"opts":["26","32","24","56","30"],"ans":0,"exp":"Double, then subtract 2, repeating: 28 − 2 = 26."},{"t":"ns","seq":["2","3","5","8","13","21"],"opts":["42","34","31","36","29"],"ans":1,"exp":"Each number is the sum of the two before it: 13 + 21 = 34."},{"t":"ns","seq":["81","27","9","3"],"opts":["3/2","1","1/3","2","0"],"ans":1,"exp":"Divide by 3 each time: 3 ÷ 3 = 1."},{"t":"ns","seq":["4","9","5","10","6","11","7"],"opts":["13","6","8","3","12"],"ans":4,"exp":"Two series take turns: 4, 5, 6, 7 and 9, 10, 11, so 12 is next."},{"t":"ns","seq":["50","45","41","38","36"],"opts":["35","33","31","36","34"],"ans":0,"exp":"Subtract 5, 4, 3, 2, then 1: 36 − 1 = 35."},{"t":"ns","seq":["1","2","6","24","120"],"opts":["144","600","240","720","840"],"ans":3,"exp":"Multiply by 2, 3, 4, 5, then 6: 120 × 6 = 720."},{"t":"ns","seq":["1/2","1","3/2","2","5/2"],"opts":["11/4","3","1/2","7/2","5"],"ans":1,"exp":"Add 1/2 each time: 5/2 + 1/2 = 3."},{"t":"ns","seq":["3","6","5","10","9","18","17"],"opts":["33","35","36","34","16"],"ans":3,"exp":"Double, then subtract 1, repeating: 17 × 2 = 34."},{"t":"ns","seq":["1","3","7","15","31"],"opts":["47","63","62","64","61"],"ans":1,"exp":"Double and add 1: 31 × 2 + 1 = 63."},{"t":"ns","seq":["12","15","13","16","14","17"],"opts":["20","19","15","18","12"],"ans":2,"exp":"Add 3, subtract 2, repeating: 17 − 2 = 15."},{"t":"ns","seq":["0.2","0.6","1.8","5.4"],"opts":["15.4","10.8","16.2","9.6","21.6"],"ans":2,"exp":"Multiply by 3 each time: 5.4 × 3 = 16.2."},{"t":"ns","seq":["1","1","2","4","3","9","4","16"],"opts":["5","20","6","17","25"],"ans":0,"exp":"Pairs of a number and its square: (1, 1), (2, 4), (3, 9), (4, 16). Next comes 5."}]},{"id":"fm","battery":"Nonverbal","name":"Figure Matrices","prompt":"Which answer goes in the empty box?","directions":"The top two figures go together in a certain way. Choose the answer that goes with the bottom-left figure in the same way.","tip":"Say the rule in words, for example “it turns a quarter-turn and changes color.” Check every part of the figure: shape, color, size, position and number.","items":[{"t":"fm","a":"<svg viewBox=\"0 0 100 100\"><polygon points=\"50.0,18.1 86.8,81.9 13.2,81.9\" fill=\"#a6a6a6\" stroke=\"#111\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><polygon points=\"50.0,40.0 52.8,47.2 60.5,47.6 54.5,52.5 56.5,60.0 50.0,55.8 43.5,60.0 45.5,52.5 39.5,47.6 47.2,47.2\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/></svg>","b":"<svg viewBox=\"0 0 100 100\"><polygon points=\"50.0, const ITEMSET = 'v2, 2026-11-24';
const KEY = 'cogat1314-site-v1';
const PIN_HASH = '150jrgx';
const SECS = DATA.sections;
const SEC_SECONDS = 600;
const CODES = { va:'VA', sc:'SC', vc:'VC', na:'NA', np:'NP', ns:'NS', fm:'FM', pf:'PF', fc:'FC' };
const L1 = ['A','B','C','D','E'], L2 = ['J','K','L','M','N'];
const letter = (qi, k) => (qi % 2 === 0 ? L1 : L2)[k];

function fresh(){ return { timed:true, run:null, attempts:[], unlocked:false }; }
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load() || fresh();
if(!Array.isArray(S.attempts)) S.attempts = [];
let view = { name:'home', attempt:null, reviewSec:null, open:null };
let tick = null;

const $app = document.getElementById('app');
const $bar = document.getElementById('bar');
const $layer = document.getElementById('layer');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const qboxify = t => esc(t).replace(/\?/g, '<span class="qbox">?</span>');
const when = iso => new Date(iso).toLocaleString([], { dateStyle:'medium', timeStyle:'short' });
function hash(s){ let x = 5381; for(const ch of s) x = (((x << 5) + x) + ch.charCodeAt(0)) >>> 0; return x.toString(36); }

/* ---------- stimulus & options ---------- */
function stim(it){
  switch(it.t){
    case 'va': return `<div class="analogy"><span class="pair"><span>${esc(it.a)}</span><span class="arr">→</span><span>${esc(it.b)}</span><span class="colon">:</span></span><span class="pair"><span>${esc(it.c)}</span><span class="arr">→</span><span class="qbox">?</span></span></div>`;
    case 'sc': return `<div class="sentence">${esc(it.s).replace('_____','<span class="gap" aria-label="blank"></span>')}</div>`;
    case 'vc': return `<div class="words">${it.w.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div>`;
    case 'na': return `<div class="na">${it.p.map((g,i)=>`<span class="grp">[ ${esc(g[0])} <span class="arr">→</span> ${i<2?esc(g[1]):'<span class="qbox">?</span>'} ]</span>`).join('')}</div>`;
    case 'np': return `<div class="eqs">${it.lines.map(l=>`<div>${qboxify(l)}</div>`).join('')}</div>`;
    case 'ns': return `<div class="series">${it.seq.map(n=>`<span>${esc(n)}</span>`).join('')}<span class="qbox">?</span></div>`;
    case 'fm': return `<div class="matrix"><span class="tile">${it.a}</span><span class="arr">→</span><span class="tile">${it.b}</span><span class="tile">${it.c}</span><span class="arr">→</span><span class="qtile">?</span></div>`;
    case 'pf': return `<div class="folds" style="--n:${it.panels.length}">${it.panels.map((p,i)=>`<span class="tile${i===it.panels.length-1?' last':''}">${p}</span>`).join('')}</div>`;
    case 'fc': return `<div class="cls">${it.stim.map(s=>`<span class="tile">${s}</span>`).join('')}</div>`;
  }
}
const isFig = it => it.t === 'fm' || it.t === 'pf' || it.t === 'fc';
function optsHtml(it, qi, chosen, reveal){
  const fig = isFig(it);
  return `<div class="${fig?'figopts':'opts'}" role="radiogroup">` + it.opts.map((o,k)=>{
    let cls = 'opt' + (fig?' figopt':'') + (chosen===k?' sel':'');
    if(reveal){ if(k===it.ans) cls += ' right'; else if(chosen===k) cls += ' wrong'; }
    const body = fig ? `<span class="tile">${o}</span>` : `<span>${esc(o)}</span>`;
    const L = letter(qi,k);
    return `<button class="${cls}" role="radio" aria-checked="${chosen===k}" aria-label="Answer ${L}" data-act="pick" data-k="${k}" ${reveal?'disabled':''}>${fig?body:''}<span class="bub"><i>${L}</i></span>${fig?'':body}</button>`;
  }).join('') + '</div>';
}

/* ---------- run control ---------- */
function curSec(){ return SECS[S.run.order[S.run.pos]]; }
function startRun(order, type){
  const now = new Date().toISOString();
  const r = { id:now, start:now, type, timed:S.timed, order, pos:0, screen:'intro', q:0, deadline:null, started:null, qEnter:null,
              answers:{}, flags:{}, qtime:{}, used:{} };
  order.forEach(i => { const s = SECS[i]; r.answers[s.id] = s.items.map(()=>null); r.flags[s.id] = []; r.qtime[s.id] = s.items.map(()=>0); });
  S.run = r; save(); view.name = 'run'; render();
}
function stamp(){
  const r = S.run; if(!r || r.screen !== 'q' || !r.qEnter) return;
  const now = Math.min(Date.now(), r.deadline || Infinity);
  const id = curSec().id;
  r.qtime[id][r.q] = Math.round((r.qtime[id][r.q] + Math.max(0, (now - r.qEnter)/1000))*10)/10;
  r.qEnter = Date.now();
}
function goTo(q){ stamp(); S.run.q = q; save(); render(); window.scrollTo(0,0); }
function beginSection(){
  const r = S.run; r.screen = 'q'; r.q = 0; r.started = Date.now(); r.qEnter = null;
  r.deadline = r.timed ? Date.now() + SEC_SECONDS*1000 : null;
  save(); render();
}
function endSection(timeUp){
  stamp();
  const r = S.run, sec = curSec();
  r.used[sec.id] = Math.round(Math.min(r.timed ? SEC_SECONDS : 1e9, (Math.min(Date.now(), r.deadline || Infinity) - (r.started || Date.now()))/1000));
  r.screen = 'done'; r.timeUp = !!timeUp; r.deadline = null; r.qEnter = null;
  save(); render();
}
function nextSection(){
  const r = S.run;
  if(r.pos < r.order.length - 1){ r.pos++; r.screen = 'intro'; r.timeUp = false; save(); render(); }
  else finishRun();
}
function finishRun(){
  const r = S.run;
  const att = { id:r.id, start:r.start, end:new Date().toISOString(), type:r.type, timed:r.timed, order:r.order,
                answers:r.answers, flags:r.flags, qtime:r.qtime, used:r.used, itemset:ITEMSET, saved:null };
  S.attempts.unshift(att); S.run = null; save();
  view = { name:'results', attempt:att.id, reviewSec:null, open:null };
  render();
  postToSite(att);
}
function startTick(){
  stopTick();
  tick = setInterval(()=>{
    if(!S.run || S.run.screen !== 'q') return stopTick();
    const el = document.getElementById('timer');
    if(S.run.deadline){
      const left = (S.run.deadline - Date.now())/1000;
      if(left <= 0){ stopTick(); closeLayer(); endSection(true); return; }
      if(el){ el.textContent = fmt(left); el.classList.toggle('low', left < 60); }
    }
  }, 250);
}
function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }

/* ---------- scoring & export ---------- */
const attempt = id => S.attempts.find(a => a.id === id);
const secsOf = att => att.order.map(i => SECS[i]);
function scoreOf(att, sec){ const a = att.answers[sec.id] || []; return sec.items.reduce((t,it,i)=>t+(a[i]===it.ans?1:0),0); }
function plain(it){
  switch(it.t){
    case 'va': return `${it.a} → ${it.b} : ${it.c} → ?`;
    case 'sc': return it.s;
    case 'vc': return it.w.join(', ');
    case 'na': return it.p.map((g,i)=>`[${g[0]} → ${i<2?g[1]:'?'}]`).join(' ');
    case 'np': return it.lines.join('  ;  ');
    case 'ns': return it.seq.join(', ') + ', ?';
  }
  return '';
}
function pad(n){ return String(n).padStart(2,'0'); }
function fname(att){ const d = new Date(att.start); return `cogat-attempt-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.txt`; }
function exportText(att){
  const secs = secsOf(att);
  const tot = secs.reduce((a,s)=>a+scoreOf(att,s),0), max = secs.reduce((a,s)=>a+s.items.length,0);
  const out = [];
  out.push('CogAT Level 13/14 practice attempt');
  out.push(`Item set: ${att.itemset}`);
  out.push(`Started: ${when(att.start)}`);
  out.push(`Finished: ${when(att.end)}`);
  out.push(`Type: ${att.type==='full' ? 'Full test' : 'Single section, ' + secs[0].name}`);
  out.push(`Timing: ${att.timed ? 'Timed, 10 minutes per section' : 'Untimed'}`);
  out.push(`Total: ${tot}/${max} (${Math.round(100*tot/max)}%)`);
  out.push('');
  out.push('SECTION SCORES');
  secs.forEach(s=>{
    const a = att.answers[s.id]; const n = a.filter(x=>x!==null).length;
    out.push(`${s.name}: ${scoreOf(att,s)}/${s.items.length}, answered ${n}, time used ${fmt(att.used[s.id]||0)}`);
  });
  out.push('');
  out.push('QUESTION DETAIL (number | result | seconds on question | question | chosen | correct)');
  secs.forEach(s=>{
    out.push('');
    out.push(`[${s.name}]`);
    const a = att.answers[s.id], tm = att.qtime[s.id] || [], fl = att.flags[s.id] || [];
    s.items.forEach((it,i)=>{
      const ch = a[i], blank = ch===null || ch===undefined, ok = ch===it.ans;
      const res = blank ? 'BLANK' : ok ? 'right' : 'WRONG';
      const fig = isFig(it);
      const chTxt = blank ? '-' : letter(i,ch) + (fig ? '' : ' ' + it.opts[ch]);
      const okTxt = letter(i,it.ans) + (fig ? '' : ' ' + it.opts[it.ans]);
      let line = `${CODES[s.id]}${i+1} | ${res}${fl.includes(i)?' (marked)':''} | ${Math.round(tm[i]||0)}s | ${fig ? 'figure question' : plain(it)} | chose ${chTxt} | correct ${okTxt}`;
      if(fig || !ok) line += ` | ${it.exp}`;
      out.push(line);
    });
  });
  return out.join('\n');
}
function download(att){
  const blob = new Blob([exportText(att)], { type:'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname(att);
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function copyText(att){
  const text = exportText(att);
  const fallback = () => {
    $layer.innerHTML = `<div class="overlay" data-act="close"><div class="panel" role="dialog" aria-label="Results text"><h3>Results text</h3><p class="small muted">Select all of this text, copy it and paste it into Claude.</p><textarea class="dump" readonly>${esc(text)}</textarea><div style="margin-top:10px"><button class="btn block" data-act="close">Done</button></div></div></div>`;
    const ta = $layer.querySelector('textarea'); ta.focus(); ta.select();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{ const n = document.getElementById('copied'); if(n) n.textContent = 'Copied. Paste it into Claude.'; }, fallback);
  } else fallback();
}
function postToSite(att){
  if(!/^https?:$/.test(location.protocol)) return;
  fetch('save.php', { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: exportText(att) })
    .then(r => r.ok ? r.json() : null)
    .then(j => { if(j && j.ok){ const a = attempt(att.id); if(a){ a.saved = j.file; save(); if(view.name==='results' && view.attempt===att.id) render(); } } })
    .catch(()=>{});
}

/* ---------- screens ---------- */
function barHtml(title, sub, right){
  return `<div class="bar"><div class="bar-in"><div class="bar-title"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div>${right||''}</div></div>`;
}
function gateScreen(){

  <form id="gate" class="gate" autocomplete="off"><label for="pin" class="small muted">Password</label>

  <p id="gerr" class="err small" role="alert"></p>
  <button class="btn" type="submit">Open the test</button></form>`;
}
function homeScreen(){
  $bar.innerHTML = barHtml('CogAT practice', '', '');
  const r = S.run;
  let groups = '';
  ['Verbal','Quantitative','Nonverbal'].forEach(b=>{
    const secs = SECS.map((s,i)=>({s,i})).filter(x=>x.s.battery===b);
    groups += `<div class="sheet"><div class="sheet-head">${b} battery<span>${secs.reduce((a,x)=>a+x.s.items.length,0)} questions</span></div>` +
      secs.map(({s,i})=>`<div class="row"><span class="num">${i+1}</span><div><h3>${s.name}</h3><div class="meta">${s.items.length} questions in 10 minutes</div></div><button class="btn ghost slim" data-act="single" data-i="${i}" ${r?'disabled':''}>Practice</button></div>`).join('') + `</div>`;
  });
  const atts = S.attempts.length ? `<h2>Past attempts on this device</h2><div class="sheet">` + S.attempts.map(a=>{
    const secs = secsOf(a); const t = secs.reduce((x,s)=>x+scoreOf(a,s),0), m = secs.reduce((x,s)=>x+s.items.length,0);
    return `<div class="att"><div><b>${esc(when(a.start))}</b><div class="meta">${a.type==='full'?'Full test':esc(secs[0].name)}, ${t} of ${m} correct</div></div><button class="btn ghost slim" data-act="viewatt" data-id="${esc(a.id)}">View</button></div>`;
  }).join('') + `</div>` : '';
  return `
  <section class="hero">
    <h1>CogAT practice test</h1>
    <p>Level 13/14, the level LASA gives students who are in 8th grade when they test. Nine sections, 176 questions, 10 minutes per section, about 90 minutes in all.</p>
  </section>
  ${r ? `<div class="callout"><p><b>A test is in progress.</b> It started ${esc(when(r.start))}. ${esc(curSec().name)} is next.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="btn" data-act="resume">Resume</button><button class="btn ghost" data-act="abandon">Discard it</button></div></div>` : `
  <div class="stack" style="margin:18px 0">
    <div><span class="seg" role="group" aria-label="Timing"><button aria-pressed="${S.timed}" data-act="timed" data-v="1">Timed</button><button aria-pressed="${!S.timed}" data-act="timed" data-v="0">Untimed</button></span>
    <div class="small muted" style="margin-top:6px">${S.timed?'10 minutes per section, like the real test':'No clock, for learning the question types'}</div></div>
    <button class="btn block" data-act="full">Start the full test</button>
  </div>`}
  ${groups}
  ${atts}
  <div class="notes small">
    <p>Scores appear only after the last section is finished. Each finished attempt is saved on this device by date and time, and can be downloaded as a results file.</p>
    <p>On test day the CogAT is on paper with a scantron sheet. Answer letters switch between A–E and J–N from one question to the next, just like the answer sheet. Keep scratch paper handy for the number sections.</p>
    <p>These are original practice questions in the CogAT format, not real test items. The score is a raw count of correct answers and can’t be turned into a CogAT percentile.</p>
  </div>`;
}
function introScreen(){
  const sec = curSec(); const i = S.run.order[S.run.pos];
  const posTxt = S.run.order.length>1 ? `Section ${S.run.pos+1} of ${S.run.order.length}` : 'Single-section practice';
  $bar.innerHTML = barHtml(esc(sec.name), posTxt, `<button class="iconbtn" data-act="home">Exit</button>`);
  return `<h1 style="font-size:1.8rem">${i+1}. ${esc(sec.name)}</h1>
  <p class="muted">${sec.battery} battery, ${sec.items.length} questions, ${S.run.timed?'10 minutes':'untimed'}</p>
  <div class="card"><p style="margin:0">${esc(sec.directions)}</p></div>
  <div class="callout"><b>Tip.</b> ${esc(sec.tip)}</div>
  ${S.run.timed?`<p class="small muted">The clock starts when you tap Start. When time runs out, the section ends and unanswered questions count as wrong, so answer every question even if you have to guess.</p>`:''}
  <div class="nav"><button class="btn block" data-act="begin">Start ${esc(sec.name)}</button></div>`;
}
function questionScreen(){
  const r = S.run, sec = curSec(), qi = r.q, it = sec.items[qi];
  const flagged = (r.flags[sec.id]||[]).includes(qi);
  r.qEnter = Date.now();
  const timer = r.deadline ? `<span id="timer" class="timer">${fmt((r.deadline-Date.now())/1000)}</span>` : `<span class="timer off">Untimed</span>`;
  $bar.innerHTML = barHtml(esc(sec.name), `Question ${qi+1} of ${sec.items.length}`, `<button class="iconbtn" data-act="flag" aria-pressed="${flagged}">${flagged?'Marked':'Mark'}</button>${timer}`);
  const last = qi === sec.items.length-1;
  return `<div class="card"><p class="prompt">${esc(sec.prompt)}</p>${stim(it)}</div>
  ${optsHtml(it, qi, r.answers[sec.id][qi], false)}
  <div class="nav">
    <button class="btn ghost" data-act="prev" ${qi===0?'disabled':''}>Back</button>
    <button class="btn ghost grow" data-act="map">All questions</button>
    ${last?`<button class="btn" data-act="finish">Finish</button>`:`<button class="btn" data-act="next">Next</button>`}
  </div>`;
}
function doneScreen(){
  const r = S.run, sec = curSec(); const n = r.answers[sec.id].filter(a=>a!==null).length;
  const more = r.pos < r.order.length-1;
  const next = more ? SECS[r.order[r.pos+1]] : null;
  const battBreak = next && next.battery !== sec.battery;
  $bar.innerHTML = barHtml(esc(sec.name), 'Section complete', '');
  return `<h1 style="font-size:1.8rem">${r.timeUp?'Time’s up':'Section complete'}</h1>
  <p>You answered ${n} of ${sec.items.length} questions in ${esc(sec.name)}.</p>
  ${battBreak?`<div class="callout">That’s the end of the ${sec.battery} battery. Stretch, get a drink of water, then start the ${next.battery} battery when you’re ready.</div>`:''}
  ${more?'':`<p>That was the last section. Your scores are ready.</p>`}
  <div class="nav">${more?`<button class="btn block" data-act="nextsec">Go to ${esc(next.name)}</button>`:`<button class="btn block" data-act="nextsec">See scores</button>`}</div>`;
}
function resultsScreen(){
  const att = attempt(view.attempt);
  if(!att){ view.name='home'; return homeScreen(); }
  $bar.innerHTML = barHtml('Scores', esc(when(att.start)), `<button class="iconbtn" data-act="home">Home</button>`);
  const secs = secsOf(att);
  const tot = secs.reduce((a,s)=>a+scoreOf(att,s),0), max = secs.reduce((a,s)=>a+s.items.length,0);
  let rows = '';
  ['Verbal','Quantitative','Nonverbal'].forEach(b=>{
    const bs = secs.filter(s=>s.battery===b); if(!bs.length) return;
    const bt = bs.reduce((a,s)=>a+scoreOf(att,s),0), bm = bs.reduce((a,s)=>a+s.items.length,0);
    rows += `<tr class="bat"><td>${b} battery</td><td class="r">${bt} / ${bm}</td><td></td></tr>`;
    bs.forEach(s=>{ const sc = scoreOf(att,s); rows += `<tr><td>${esc(s.name)}<div class="bar-meter"><i style="width:${Math.round(100*sc/s.items.length)}%"></i></div></td><td class="r">${sc} / ${s.items.length}</td><td class="r"><button class="btn ghost slim" data-act="review" data-id="${s.id}">Review</button></td></tr>`; });
  });
  return `<p class="muted" style="margin-top:18px">${att.type==='full'?'Full test':'Single section'}, started ${esc(when(att.start))}</p>
  <div class="score">${tot}<small> / ${max}</small></div>
  <p>${Math.round(100*tot/max)}% correct.</p>
  <table>${rows}</table>
  <h2>Save the results</h2>
  <p class="small">The results file lists every answer, the time spent on each question and the correct answers. Upload it to Claude, or copy the text and paste it into a chat, to get a full breakdown.</p>
  ${att.saved?`<p class="small ok-note">Also saved on the website as ${esc(att.saved)}.</p>`:''}
  <div class="stack">
    <button class="btn block" data-act="download">Download results file</button>
    <button class="btn ghost block" data-act="copy">Copy results text</button>
    <p id="copied" class="small ok-note" role="status"></p>
  </div>
  <div class="notes small"><p>The real CogAT reports age percentiles, and LASA re-norms scores against its own applicants, so this raw score can’t predict a real result. Use it to see which question types need more practice.</p></div>
  <div class="stack"><button class="btn ghost block" data-act="home">Back to start</button></div>`;
}
function reviewScreen(){
  const att = attempt(view.attempt); const sec = SECS.find(s=>s.id===view.reviewSec);
  const a = att.answers[sec.id] || [];
  $bar.innerHTML = barHtml(esc(sec.name), `Review, ${scoreOf(att,sec)} of ${sec.items.length} correct`, `<button class="iconbtn" data-act="results">Scores</button>`);
  return `<p class="muted" style="margin-top:14px">Tap a question to see it with the explanation.</p>` + sec.items.map((it,i)=>{
    const ok = a[i]===it.ans, blank = a[i]===null || a[i]===undefined;
    const open = view.open===i;
    const head = `<button class="rv" data-act="open" data-q="${i}" aria-expanded="${open}"><span class="mk ${ok?'y':'n'}">${ok?'✓':'✗'}</span><span style="flex:1">Question ${i+1}</span><span class="small muted">${blank?'No answer':'Chose '+letter(i,a[i])}${ok?'':', correct: '+letter(i,it.ans)}</span></button>`;
    if(!open) return head;
    return head + `<div class="card"><p class="prompt">${esc(sec.prompt)}</p>${stim(it)}</div>${optsHtml(it,i,blank?null:a[i],true)}<div class="exp"><b>Answer ${letter(i,it.ans)}.</b> ${esc(it.exp)}</div>`;
  }).join('') + `<div class="nav"><button class="btn ghost block" data-act="results">Back to scores</button></div>`;
}
function render(){
  closeLayer();
  if(!S.unlocked){ stopTick(); $app.innerHTML = gateScreen(); setTimeout(()=>{ const p = document.getElementById('pin'); if(p) p.focus(); }, 0); return; }
  if(view.name === 'run' && S.run){
    const sc = S.run.screen;
    if(sc==='q' && S.run.deadline && Date.now() >= S.run.deadline){ endSection(true); return; }
    $app.innerHTML = sc==='intro'?introScreen():sc==='q'?questionScreen():doneScreen();
    if(sc==='q') startTick(); else stopTick();
  } else if(view.name === 'results'){ stopTick(); $app.innerHTML = resultsScreen(); }
  else if(view.name === 'review'){ stopTick(); $app.innerHTML = reviewScreen(); }
  else { stopTick(); view.name='home'; $app.innerHTML = homeScreen(); }
}
function openMap(){
  const r = S.run, sec = curSec(); const a = r.answers[sec.id]; const f = r.flags[sec.id]||[];
  const n = a.filter(x=>x!==null).length;
  $layer.innerHTML = `<div class="overlay" data-act="close"><div class="panel" role="dialog" aria-label="All questions"><h3>${esc(sec.name)}</h3><p class="small muted" style="margin:4px 0 0">${n} of ${a.length} answered. Filled circles are answered; a red dot means marked for review.</p><div class="grid">${a.map((x,i)=>`<button class="cell${x!==null?' ans':''}${i===r.q?' cur':''}${f.includes(i)?' flag':''}" data-act="jump" data-q="${i}">${i+1}</button>`).join('')}</div><div style="display:flex;gap:10px"><button class="btn ghost" style="flex:1" data-act="close">Keep going</button><button class="btn" style="flex:1" data-act="finish">Finish section</button></div></div></div>`;
}
function closeLayer(){ $layer.innerHTML=''; }
function confirmFinish(){
  const r = S.run, sec = curSec(); const left = r.answers[sec.id].filter(x=>x===null).length;
  if(left===0){ closeLayer(); endSection(false); return; }
  $layer.innerHTML = `<div class="overlay" data-act="close"><div class="panel" role="dialog" aria-label="Finish section"><h3>${left} question${left>1?'s':''} still blank</h3><p>Blank answers count as wrong. On the real test you can’t leave early either, so use any spare time to check your work.</p><div style="display:flex;gap:10px;margin-top:12px"><button class="btn ghost" style="flex:1" data-act="close">Go back</button><button class="btn" style="flex:1" data-act="finishnow">Finish anyway</button></div></div></div>`;
}

document.addEventListener('submit', e=>{
  if(e.target.id !== 'gate') return;
  e.preventDefault();
  const v = (document.getElementById('pin').value || '').trim();
  if(hash('cogat:' + v) === PIN_HASH){ S.unlocked = true; save(); render(); }
  else { document.getElementById('gerr').textContent = 'That password didn’t work. Check it and try again.'; }
});
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act;
  if(act==='close'){ if(e.target===t || t.tagName==='BUTTON') closeLayer(); return; }
  switch(act){
    case 'timed': S.timed = t.dataset.v==='1'; save(); render(); break;
    case 'full': startRun(SECS.map((_,i)=>i), 'full'); break;
    case 'single': startRun([+t.dataset.i], 'single'); break;
    case 'resume': view.name='run'; render(); break;
    case 'abandon': if(confirm('Discard the test in progress? Its answers will be lost.')){ S.run=null; save(); render(); } break;
    case 'home': stamp(); save(); view.name='home'; render(); window.scrollTo(0,0); break;
    case 'results': view.name='results'; view.open=null; render(); window.scrollTo(0,0); break;
    case 'viewatt': view = { name:'results', attempt:t.dataset.id, reviewSec:null, open:null }; render(); window.scrollTo(0,0); break;
    case 'begin': beginSection(); break;
    case 'pick': { const r=S.run, sec=curSec(); r.answers[sec.id][r.q] = +t.dataset.k; save();
      document.querySelectorAll('.opt').forEach((b,k)=>{ const on = k===+t.dataset.k; b.classList.toggle('sel',on); b.setAttribute('aria-checked',on); }); break; }
    case 'prev': if(S.run.q>0) goTo(S.run.q-1); break;
    case 'next': goTo(S.run.q+1); break;
    case 'jump': goTo(+t.dataset.q); break;
    case 'map': openMap(); break;
    case 'flag': { stamp(); const r=S.run, sec=curSec(); const f=r.flags[sec.id]; const i=f.indexOf(r.q); if(i>=0) f.splice(i,1); else f.push(r.q); save(); render(); break; }
    case 'finish': confirmFinish(); break;
    case 'finishnow': closeLayer(); endSection(false); break;
    case 'nextsec': nextSection(); break;
    case 'review': view.name='review'; view.reviewSec=t.dataset.id; view.open=null; render(); window.scrollTo(0,0); break;
    case 'open': view.open = view.open===+t.dataset.q ? null : +t.dataset.q; render(); break;
    case 'download': download(attempt(view.attempt)); break;
    case 'copy': copyText(attempt(view.attempt)); break;
  }
});
document.addEventListener('keydown', e=>{
  if(!S.run || S.run.screen!=='q' || view.name!=='run' || $layer.innerHTML) return;
  if(e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toUpperCase(); const qi = S.run.q;
  const idx = (qi%2===0 ? L1 : L2).indexOf(k);
  if(idx>=0){ const b = document.querySelectorAll('.opt')[idx]; if(b) b.click(); }
  else if(e.key==='ArrowRight'){ if(qi<curSec().items.length-1) goTo(qi+1); }
  else if(e.key==='ArrowLeft'){ if(qi>0) goTo(qi-1); }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ stamp(); if(S.run) S.run.qEnter = null; save(); }
  else if(S.run && S.run.screen==='q' && view.name==='run') render();
});
render();
</script>
</body>
</html>
