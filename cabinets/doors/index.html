<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Private</title>
<style>
:root{--bg:#f3f4f2;--ink:#1d2520;--muted:#5d6a62;--line:#cfd6cf;--card:#fff;--accent:#456b3f;--accent-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--ink:#e8eee7;--muted:#9aa89e;--line:#2c3730;--card:#1a211d;--accent:#9cc28b;--accent-ink:#10170f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:320px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:12px}
label{font-size:14px;color:var(--muted)}
input{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:10px 12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
#msg{min-height:1.4em;margin:0;font-size:14px;color:var(--muted)}
[hidden]{display:none!important}
.chk{display:flex;flex-direction:row;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.chk input{width:auto;margin:0}
#wait{margin:0;color:var(--muted)}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <label for="pw">Password</label>
  <input id="pw" type="password" inputmode="numeric" autocomplete="off" autofocus required>
  <label class="chk"><input id="rem" type="checkbox" checked> Keep me unlocked on this device</label>
  <button id="go" type="submit">Open</button>
  <p id="msg" role="status"></p>
</form>
<p id="wait" hidden>Opening...</p>
